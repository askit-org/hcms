<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="crossGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Rounded Rect Container -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Medical Cross Shape -->
  <g filter="url(#glow)">
    <path d="M 216 112 L 296 112 C 309 112 320 123 320 136 L 320 216 L 400 216 C 413 216 424 227 424 240 L 424 320 C 424 333 413 344 400 344 L 320 344 L 320 424 C 320 437 309 448 296 448 L 216 448 C 203 448 192 437 192 424 L 192 344 L 112 344 C 99 344 88 333 88 320 L 88 240 C 88 227 99 216 112 216 L 192 216 L 192 136 C 192 123 203 112 216 112 Z" fill="none" stroke="#e0f2fe" stroke-width="20" stroke-linejoin="round"/>
  </g>
  
  <!-- Heartbeat ECG Pulse line -->
  <path d="M 72 280 L 176 280 L 200 220 L 228 340 L 260 170 L 292 320 L 316 260 L 336 280 L 440 280" fill="none" stroke="#38bdf8" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
</svg>
